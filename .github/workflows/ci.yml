name: CI

# Temporarily disabled while investigating Windows test hangs and excess duplicate runs.
# Restore push/pull_request triggers only after adding concurrency cancellation,
# explicit job timeouts, and isolating the hanging Windows test.
on:
  workflow_dispatch:

jobs:
  test:
    name: Test Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --workspace

  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --doc --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run -p xtask -- validate
      - run: cargo run -p xtask -- corpus check --json target/corpus-smoke-report.json
      - run: cargo run -p stan-tools --bin stanfmt -- --check crates/stan-language/tests/fixtures/parser/valid/basic.stan
      - run: cargo run -p stan-tools --bin stanlint -- crates/stan-language/tests/fixtures/parser/valid/basic.stan

  vscode:
    name: VS Code client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: editors/vscode
        run: npm test
