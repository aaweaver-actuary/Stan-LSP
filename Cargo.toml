[workspace]
members = [
    "crates/stan-token-derive",
    "crates/stan-language",
    "crates/stan-language-server",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-std", "macros", "process", "rt-multi-thread"] }
tower-lsp-server = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

